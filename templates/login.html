{% extends "base.html" %}

{% block title %}Sign In &mdash; CreditPulse AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5 col-xl-4">
        
        <div class="glass-card p-4 p-sm-5">
            <div class="text-center mb-4">
                <div class="brand-icon-wrapper mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
                <p class="text-secondary small mb-0">Sign in to access the credit underwriting platform</p>
            </div>

            <!-- Demo Fast Fill Helper -->
            <div class="p-3 rounded-3 bg-light border mb-4 text-center">
                <div class="small fw-semibold text-secondary mb-2">
                    <i class="bi bi-magic me-1 text-primary"></i> Fast Reviewer Demo Login:
                </div>
                <button type="button" class="btn btn-sm btn-outline-primary fw-semibold px-3 py-1" onclick="autofillDemo()">
                    Fill Demo Admin Credentials
                </button>
            </div>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@company.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="password" class="form-label">Password</label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-gradient w-100 py-3 fw-bold mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Account
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top small text-muted">
                Don't have an account? <a href="{{ url_for('auth.register') }}" class="fw-semibold text-primary text-decoration-none">Register here</a>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function autofillDemo() {
    document.getElementById('email').value = 'admin@creditapproval.ai';
    document.getElementById('password').value = 'Admin@123';
}

function togglePassword() {
    const input = document.getElementById('password');
    const icon = document.getElementById('toggleIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}
</script>
{% endblock %}
